services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - game-server

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NITRO_PORT=3000
      - DATABASE_URL=postgres://petakuis:${POSTGRES_PASSWORD:-petakuis_secret}@postgres:5432/petakuis
      - REDIS_URL=redis://redis:6379
      - NUXT_PUBLIC_GAME_SERVER_URL=${PUBLIC_GAME_SERVER_URL:-http://localhost:3001}
      - INTERNAL_SECRET=${INTERNAL_SECRET:-petakuis_internal_secret}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - postgres
      - redis

  game-server:
    build:
      context: .
      dockerfile: apps/game-server/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REDIS_URL=redis://redis:6379
      - WEB_INTERNAL_URL=http://web:3000
      - INTERNAL_SECRET=${INTERNAL_SECRET:-petakuis_internal_secret}
    depends_on:
      - redis

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=petakuis
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-petakuis_secret}
      - POSTGRES_DB=petakuis
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  redisdata:
