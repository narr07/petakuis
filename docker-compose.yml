# Petakuis: web (Nuxt) + game server (Socket.IO).
#
#   cp .env.example .env      # isi PUBLIC_URL dan INTERNAL_SECRET
#   docker compose up -d --build
#
# Bawaan: kedua layanan hanya dibuka di 127.0.0.1 (WEB_PORT, GAME_PORT) untuk dipasang di
# belakang proxy yang sudah ada, misalnya Cloudflare Tunnel:
#   <domain>  path socket.io  -> http://localhost:${GAME_PORT}
#   <domain>  (lainnya)       -> http://localhost:${WEB_PORT}
#
# VPS kosong tanpa proxy: jalankan juga Caddy (HTTPS otomatis, butuh port 80/443 terbuka):
#   docker compose --profile caddy up -d --build
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    # Nuxt membaca konfigurasi saat berjalan hanya dari variabel berawalan NUXT_.
    environment:
      - NUXT_GAME_SERVER_INTERNAL_URL=http://game-server:3001
      - NUXT_INTERNAL_SECRET=${INTERNAL_SECRET:?Isi INTERNAL_SECRET di .env}
      - NUXT_PUBLIC_GAME_SERVER_URL=${PUBLIC_GAME_URL:-${PUBLIC_URL:?Isi PUBLIC_URL di .env}}
      - NUXT_GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Login (Better Auth)
      - NUXT_PUBLIC_SITE_URL=${PUBLIC_URL:?Isi PUBLIC_URL di .env}
      - NUXT_AUTH_SECRET=${AUTH_SECRET:?Isi AUTH_SECRET di .env}
      - NUXT_ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - NUXT_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - NUXT_GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - NUXT_PUBLIC_GOOGLE_LOGIN_ENABLED=${GOOGLE_LOGIN_ENABLED:-false}
      - NUXT_RESEND_API_KEY=${RESEND_API_KEY:-}
      - NUXT_MAIL_FROM=${MAIL_FROM:-Petakuis <noreply@permadi.dev>}
      - NUXT_PUBLIC_CONTACT_EMAIL=${CONTACT_EMAIL:-}
      # Aplikasi Android (TWA): sidik jari SHA-256 kunci upload + kunci App signing Play Console, dipisah koma
      - NUXT_TWA_SHA256_FINGERPRINTS=${TWA_SHA256_FINGERPRINTS:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3000"
    volumes:
      - webdata:/data
    depends_on:
      - game-server

  game-server:
    build:
      context: .
      dockerfile: apps/game-server/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3001
      - INTERNAL_SECRET=${INTERNAL_SECRET:?Isi INTERNAL_SECRET di .env}
      - ALLOWED_ORIGINS=${PUBLIC_URL:?Isi PUBLIC_URL di .env}
      - WEB_INTERNAL_URL=http://web:3000
    ports:
      - "127.0.0.1:${GAME_PORT:-3101}:3001"

  # Hanya untuk VPS tanpa proxy lain. Domain diambil dari PUBLIC_URL (tanpa https://).
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${CADDY_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - game-server

volumes:
  # Berkas database SQLite. Dicadangkan harian oleh scripts/backup-db.sh (cron di VPS).
  webdata:
  caddy_data:
  caddy_config:
