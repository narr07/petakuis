# Jalankan di VPS:  cp .env.example .env  (isi DOMAIN & INTERNAL_SECRET)  lalu  docker compose up -d --build
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:?Isi DOMAIN di .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - game-server

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    # Nuxt membaca konfigurasi saat berjalan hanya dari variabel berawalan NUXT_.
    environment:
      - NUXT_GAME_SERVER_INTERNAL_URL=http://game-server:3001
      - NUXT_INTERNAL_SECRET=${INTERNAL_SECRET:?Isi INTERNAL_SECRET di .env}
      - NUXT_PUBLIC_GAME_SERVER_URL=https://${DOMAIN:?Isi DOMAIN di .env}
      - NUXT_GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - webdata:/data
    depends_on:
      - game-server

  game-server:
    build:
      context: .
      dockerfile: apps/game-server/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3001
      - INTERNAL_SECRET=${INTERNAL_SECRET:?Isi INTERNAL_SECRET di .env}
      - ALLOWED_ORIGINS=https://${DOMAIN:?Isi DOMAIN di .env}
      - WEB_INTERNAL_URL=http://web:3000

volumes:
  caddy_data:
  caddy_config:
  # Berkas database SQLite. Cadangkan isi volume ini secara berkala.
  webdata:
