<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <!-- Concept B: Maskot "Kuispi" si Rubah Petualang Pixel / Pokémon Style -->
  <!-- Rounded Shield Base / Background Badge -->
  <rect x="20" y="20" width="216" height="216" rx="48" fill="#15803d" stroke="#16211b" stroke-width="8"/>
  <!-- Inner Warm Background -->
  <rect x="32" y="32" width="192" height="192" rx="36" fill="#faf6ee"/>

  <!-- Scout Feather / Compass Arrow on Ear -->
  <path d="M128 42l16 28h-32l16-28Z" fill="#f59e0b" stroke="#16211b" stroke-width="4"/>

  <!-- Fox Ears Outer -->
  <polygon points="56,76 96,44 104,96" fill="#c2410c" stroke="#16211b" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="200,76 160,44 152,96" fill="#c2410c" stroke="#16211b" stroke-width="6" stroke-linejoin="round"/>
  <!-- Fox Ears Inner (Cream) -->
  <polygon points="68,76 94,54 100,90" fill="#fef08a"/>
  <polygon points="188,76 162,54 156,90" fill="#fef08a"/>

  <!-- Fox Head Shape (Geometric Adventure Cap + Cheeks) -->
  <path d="M80 84h96c24 0 36 20 36 44 0 32-34 68-84 76-50-8-84-44-84-76 0-24 12-44 36-44Z" fill="#ea580c" stroke="#16211b" stroke-width="8" stroke-linejoin="round"/>

  <!-- Cream Cheeks / Muzzle -->
  <path d="M72 134c8 22 28 46 56 54 28-8 48-32 56-54 0 0-14-16-32-12-16 4-32 4-48-12-18-4-32 12-32 12Z" fill="#faf6ee" stroke="#16211b" stroke-width="6" stroke-linejoin="round"/>

  <!-- Explorer Cap Visor / Front Band -->
  <path d="M72 100c18-6 38-8 56-8s38 2 56 8v12c-18-5-38-6-56-6s-38 1-56 6v-12Z" fill="#15803d" stroke="#16211b" stroke-width="5"/>
  <circle cx="128" cy="98" r="7" fill="#fef08a" stroke="#16211b" stroke-width="3"/>

  <!-- Big Curious Pixel-Style Eyes -->
  <ellipse cx="102" cy="132" rx="7" ry="11" fill="#16211b"/>
  <ellipse cx="154" cy="132" rx="7" ry="11" fill="#16211b"/>
  <!-- Eye Catchlights -->
  <circle cx="104" cy="128" r="3" fill="#ffffff"/>
  <circle cx="156" cy="128" r="3" fill="#ffffff"/>

  <!-- Cute Nose & Smile -->
  <polygon points="128,154 122,146 134,146" fill="#16211b"/>
  <path d="M123 158c3 3 7 3 10 0" stroke="#16211b" stroke-width="4" stroke-linecap="round"/>
</svg>
