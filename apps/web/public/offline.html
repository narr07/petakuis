<!doctype html>
<html lang="id">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#2563EB">
	<title>Tidak terhubung · Petakuis</title>
	<!--
		Halaman ini disajikan service worker (public/sw.js) saat Petakuis tidak bisa dihubungi.
		Sengaja berdiri sendiri: tanpa Nuxt, Nuxt UI, font, atau berkas lain, karena saat offline
		tidak ada yang bisa dimuat. Bila diubah, naikkan nama CACHE di sw.js.
	-->
	<style>
		:root {
			--bg: #f8fafc;
			--card: #ffffff;
			--border: #e2e8f0;
			--text: #0f172a;
			--muted: #475569;
			--primary: #2563eb;
			--primary-hover: #1d4ed8;
			--on-primary: #ffffff;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--bg: #09090b;
				--card: #18181b;
				--border: #27272a;
				--text: #fafafa;
				--muted: #a1a1aa;
				--primary: #3b82f6;
				--primary-hover: #60a5fa;
				--on-primary: #09090b;
			}
		}
		* { box-sizing: border-box; }
		html, body { height: 100%; margin: 0; }
		body {
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
			background: var(--bg);
			color: var(--text);
			font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
			line-height: 1.5;
		}
		main {
			width: 100%;
			max-width: 400px;
			padding: 32px 24px;
			border: 1px solid var(--border);
			background: var(--card);
			text-align: center;
		}
		.logo { width: 56px; height: 56px; }
		.logo rect { fill: var(--primary); }
		h1 { margin: 20px 0 8px; font-size: 1.25rem; line-height: 1.3; }
		p { margin: 0 0 12px; color: var(--muted); font-size: 0.95rem; }
		button {
			width: 100%;
			margin-top: 12px;
			padding: 12px 16px;
			border: 0;
			background: var(--primary);
			color: var(--on-primary);
			font: inherit;
			font-weight: 600;
			cursor: pointer;
		}
		button:hover { background: var(--primary-hover); }
		button:disabled { opacity: 0.7; cursor: progress; }
		.status { margin-top: 16px; font-size: 0.85rem; min-height: 1.3em; }
	</style>
</head>
<body>
	<main>
		<svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Petakuis">
			<rect x="42" y="11" width="48" height="48"/><rect x="104" y="11" width="48" height="48"/><rect x="166" y="11" width="48" height="48"/>
			<rect x="42" y="73" width="48" height="48"/><rect x="166" y="73" width="48" height="48"/>
			<rect x="42" y="135" width="48" height="48"/><rect x="104" y="135" width="48" height="48"/><rect x="166" y="135" width="48" height="48"/>
			<rect x="42" y="197" width="48" height="48"/>
		</svg>
		<h1>Petakuis belum bisa dihubungi</h1>
		<p>Periksa koneksi internet atau Wi-Fi sekolah. Bila internet lancar, server mungkin sedang dipelihara sebentar.</p>
		<p>Nilai yang sudah dikirim tetap tersimpan. Setelah tersambung, masuk lagi dengan PIN yang sama.</p>
		<button id="retry" type="button">Coba lagi</button>
		<p class="status" id="status" aria-live="polite">Mencoba menyambung otomatis…</p>
	</main>
	<script>
		(function () {
			var button = document.getElementById('retry')
			var status = document.getElementById('status')

			// Muat ulang hanya bila web benar-benar bisa dijangkau lagi, supaya tidak berkedip.
			function check(manual) {
				if (manual) {
					button.disabled = true
					status.textContent = 'Memeriksa koneksi…'
				}
				fetch('/api/health', { cache: 'no-store' })
					.then(function (resp) {
						if (resp.status < 500) return true
						return resp.json().then(function (body) { return body && body.web === true }, function () { return false })
					})
					.catch(function () { return false })
					.then(function (reachable) {
						if (reachable) {
							status.textContent = 'Tersambung. Memuat ulang…'
							location.reload()
							return
						}
						button.disabled = false
						status.textContent = manual
							? 'Belum tersambung. Mencoba lagi otomatis…'
							: 'Mencoba menyambung otomatis…'
					})
			}

			button.addEventListener('click', function () { check(true) })
			window.addEventListener('online', function () { check(false) })
			setInterval(function () { check(false) }, 10000)
		})()
	</script>
</body>
</html>
